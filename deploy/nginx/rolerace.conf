# RoleRace — Nginx site (install to /etc/nginx/sites-available/rolerace
# and symlink into sites-enabled only AFTER the app is healthy on
# 127.0.0.1:3100). Certbot adds the TLS block after DNS resolves.
#
#   sudo certbot --nginx -d app.rolerace.com -d go.rolerace.com

# App + permanent Career Card share origin — same upstream.
server {
    listen 80;
    server_name app.rolerace.com go.rolerace.com;

    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF export and AI review can take well over a minute.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 10s;
    }
}
