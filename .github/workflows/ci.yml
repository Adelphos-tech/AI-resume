name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    env:
      # Placeholder only: Prisma config requires DATABASE_URL to be present
      # for client generation/build. No database is provisioned in CI.
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build
